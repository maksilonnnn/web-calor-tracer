    <div class="register-container">
      <app-card class="register-card">
        <div class="register-header">
          <h1 class="register-title" data-test="register-title">Регистрация</h1>
          <p class="register-subtitle">Заполните форму для создания аккаунта</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form">
          <app-input
            label="Имя"
            type="text"
            placeholder="Введите ваше имя"
            formControlName="name"
            hint="От 1 до 100 символов"
            [error]="nameError()"
            data-test="name-input"
          />

          <app-input
            label="Логин"
            type="text"
            placeholder="Придумайте логин"
            formControlName="login"
            hint="От 1 до 100 символов, латиница; не меняется после регистрации"
            [error]="loginError()"
            data-test="login-input"
          />

          <app-input
            label="Email"
            type="email"
            placeholder="example@mail.com"
            formControlName="email"
            [error]="emailError()"
            data-test="email-input"
          />

          <app-input
            label="Пароль"
            type="password"
            placeholder="Минимум 8 символов"
            formControlName="password"
            hint="Не менее 8 символов; минимум одна цифра, одна буква и один спецзнак; пароли должны совпадать"
            autocomplete="new-password"
            [error]="passwordError()"
            data-test="password-input"
          />

          <app-input
            label="Повторите пароль"
            type="password"
            placeholder="Повторите пароль"
            formControlName="repeatPassword"
            autocomplete="new-password"
            [error]="repeatPasswordError()"
            data-test="repeat-password-input"
          />

          <app-button
            type="submit"
            size="lg"
            fullWidth
            [loading]="submitState.busy()"
            data-test="register-submit"
          >
            @if (submitState.busy()) {
              Отправка…
            } @else {
              Зарегистрироваться
            }
          </app-button>
        </form>

        <p class="register-footer">
          Уже есть аккаунт?
          <a routerLink="/login" class="login-link" data-test="login-link">Войти</a>
        </p>
      </app-card>
    </div>
