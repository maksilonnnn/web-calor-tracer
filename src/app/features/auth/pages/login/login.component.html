    <div class="login-container">
      <app-card class="login-card">
        <div class="login-header">
          <h1 class="login-title" data-test="login-title">Вход в аккаунт</h1>
          <p class="login-subtitle">Введите логин и пароль</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
          <app-input
            label="Логин"
            type="text"
            placeholder="Введите логин"
            formControlName="login"
            autocomplete="username"
            [error]="loginError()"
            data-test="login-input"
          />

          <app-input
            label="Пароль"
            type="password"
            placeholder="Введите пароль"
            formControlName="password"
            autocomplete="current-password"
            [error]="passwordError()"
            data-test="password-input"
          />

          <app-button
            type="submit"
            size="lg"
            fullWidth
            [loading]="submitState.busy()"
            data-test="login-submit"
          >
            @if (submitState.busy()) {
              Отправка…
            } @else {
              Войти
            }
          </app-button>
        </form>

        @if (errorMessage()) {
          <p class="login-error" role="alert" data-test="login-error">{{ errorMessage() }}</p>
        }

        <p class="login-footer">
          Нет аккаунта?
          <a routerLink="/register" class="register-link" data-test="register-link">Зарегистрироваться</a>
        </p>
      </app-card>
    </div>
